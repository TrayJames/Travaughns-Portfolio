name: Deploy

on:
  push:
    branches:
      - main
  # Allows re-running a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Least privilege by default: the build job only ever needs to read the repo.
# The deploy job widens this for itself below. Nothing here can write to the
# repository, so the gh-pages branch is now frozen as a rollback target.
permissions:
  contents: read

# Let an in-flight deploy finish rather than cancelling it midway through
# publishing, but queue any newer run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Fails early with a clear message if Settings > Pages > Source is not
      # set to "GitHub Actions".
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0 - do not unpin this.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # Scoped to this job only, so `npm ci` in the build job never runs with a
    # token that can publish. Note this replaces the top-level permissions
    # block rather than adding to it - deploy-pages needs no repo access.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
